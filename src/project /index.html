<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soda Bar - Mix Your Drink</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Open+Sans&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Soda Bar Ordering App</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="mix.html" class="active">Mix</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <a href="confirmation.html">History</a>
    </nav>
  </header>

  <main>
    <section id="mix-container">
      <div id="flavor-panel">
        <h2>Flavor List</h2>
        <ul id="flavor-list"></ul>
      </div>
      <div id="mixing-area">
        <h2>Drop Your Flavors Here</h2>
        <div id="drop-zone">Drag flavors here</div>
        <div id="subtotal">Subtotal: $0.00</div>
        <button id="add-to-cart-btn" disabled>Add to Cart</button>
      </div>
    </section>
  </main>

  <footer>
    <p>Contact us: soda@example.com | Follow us on social media!</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/mix.js"></script>
</body>
</html>
