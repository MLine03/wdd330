<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soda Bar - Order Confirmation</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Open+Sans&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Soda Bar Ordering App</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="mix.html">Mix</a>
      <a href="cart.html">Cart</a>
      <a href="confirmation.html" class="active">History</a>
    </nav>
  </header>

  <main>
    <section id="confirmation-message">
      <h2>✅ Your order is confirmed!</h2>
      <p>Pickup Time: <span id="pickup-time"></span></p>
      <button onclick="window.location.href='index.html'">Back to Home</button>
      <button onclick="window.location.href='mix.html'">Mix Another Drink</button>
    </section>
  </main>

  <footer>
    <p>Contact us: soda@example.com | Follow us on social media!</p>
  </footer>

  <script>
    // Show pickup time (mock)
    const pickupTimeEl = document.getElementById('pickup-time');
    const now = new Date();
    now.setMinutes(now.getMinutes() + 15);
    pickupTimeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  </script>
</body>
</html>
