<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <h1>Checkout</h1>
  </header>

  <main>
    <form id="checkoutForm">
      <fieldset>
        <legend>Customer Information</legend>
        <label>First Name:
          <input type="text" name="fname" required>
        </label>
        <label>Last Name:
          <input type="text" name="lname" required>
        </label>
        <label>Street Address:
          <input type="text" name="street" required>
        </label>
        <label>City:
          <input type="text" name="city" required>
        </label>
        <label>State:
          <input type="text" name="state" required>
        </label>
        <label>Zip Code:
          <input type="text" name="zip" required>
        </label>
      </fieldset>

      <fieldset>
        <legend>Payment Information</legend>
        <label>Credit Card Number:
          <input type="text" name="cardNumber" required>
        </label>
        <label>Expiration Date:
          <input type="text" name="expiration" placeholder="MM/YY" required>
        </label>
        <label>Security Code:
          <input type="text" name="code" required>
        </label>
      </fieldset>

      <section id="orderSummary">
        <h2>Order Summary</h2>
        <p>Subtotal: $<span id="subtotal">0.00</span></p>
        <p>Tax: $<span id="tax">0.00</span></p>
        <p>Shipping: $<span id="shipping">0.00</span></p>
        <p>Total: $<span id="orderTotal">0.00</span></p>
      </section>

      <button type="submit" id="checkoutSubmit">Place Order</button>
    </form>
  </main>

  <script type="module">
    import CheckoutProcess from './CheckoutProcess.mjs';

    // Initialize checkout process
    const myCheckout = new CheckoutProcess();

    // Load subtotal when page loads
    document.addEventListener('DOMContentLoaded', () => {
      myCheckout.displaySubtotal();
    });

    // Form submission
    document.querySelector('#checkoutForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const form = document.querySelector('#checkoutForm');

      // Check HTML validation
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      // Run checkout process
      myCheckout.checkout(form);
    });
  </script>
</body>
</html>
